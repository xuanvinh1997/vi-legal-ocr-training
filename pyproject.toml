[project]
name = "ocr-train"
version = "0.1.0"
description = "Fine-tune a small PaddleOCR stack (detection, recognition, layout) on Vietnamese legal documents"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pillow",
  "pymupdf",
  "pyyaml",
  "fonttools",
  "rapidfuzz",
  "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]
# VietOCR fine-tuning (scripts/run_vietocr.sh). Also needs torch + torchvision (Colab has them) and `pip install --no-deps vietocr==0.3.13`:
# vietocr's own dependency list pins imgaug, which does not import on numpy 2, and the part of vietocr that uses it is not used here.
vietocr = ["einops", "gdown", "requests", "tqdm"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ocr_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
